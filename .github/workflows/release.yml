name: release

# Publish a version (it must match Cargo.toml) either way:
#   git tag v0.1.0 && git push origin v0.1.0
#   Actions → release → Run workflow → version 0.1.0   (creates the v0.1.0 tag on the chosen branch)
#
# The release carries:
#   yunori-mail-{x86_64,aarch64}-linux.tar.gz (+ .sha256)  static musl binaries, console embedded
#   install.sh                                              the one-line installer, pinned to this version
#   SHA256SUMS
# so this always installs the newest release:
#   curl -fsSL https://github.com/FutureForge-Studios/yunori-mail/releases/latest/download/install.sh | sudo sh

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (must match Cargo.toml)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  console:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: console-dist
          path: console/dist
          retention-days: 1

  build:
    name: Static binary (${{ matrix.arch }})
    needs: console
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
          - arch: aarch64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: console-dist
          path: console/dist
      - name: Tag matches Cargo.toml
        run: |
          v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ "v$v" = "$TAG" ] || { echo "Cargo.toml says $v but the release is $TAG"; exit 1; }
      - name: Toolchain (Rust, plus zig as the musl cross-linker)
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
          python3 -m venv "$RUNNER_TEMP/zig"
          "$RUNNER_TEMP/zig/bin/pip" install --quiet ziglang==0.13.0
          echo "$RUNNER_TEMP/zig/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.24.1
      - run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          bin="target/${{ matrix.target }}/release/yunori-mail"
          file "$bin" | grep -q 'statically linked'
          mkdir -p dist
          tar -czf "dist/yunori-mail-${{ matrix.arch }}-linux.tar.gz" -C "$(dirname "$bin")" yunori-mail
          (cd dist && sha256sum "yunori-mail-${{ matrix.arch }}-linux.tar.gz" > "yunori-mail-${{ matrix.arch }}-linux.tar.gz.sha256")
      - name: One-line installer against these files
        if: matrix.arch == 'x86_64'
        run: |
          YUNORI_SKIP_INSTALL=1 YUNORI_VERSION="${TAG#v}" YUNORI_BASE_URL="file://$PWD/dist" \
            YUNORI_PREFIX="$RUNNER_TEMP/prefix" sh packaging/install.sh
          "$RUNNER_TEMP/prefix/bin/yunori-mail" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist
          retention-days: 7

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Pin the installer to this release
        run: |
          v="${TAG#v}"
          sed "s/^DEFAULT_VERSION=\"latest\"$/DEFAULT_VERSION=\"$v\"/" packaging/install.sh > dist/install.sh
          grep -q "^DEFAULT_VERSION=\"$v\"$" dist/install.sh
          (cd dist && sha256sum ./*.tar.gz install.sh | sed 's# \./# #' > SHA256SUMS)
          ls -l dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release made by hand in the GitHub UI: attach the files to it.
            gh release upload "$TAG" dist/* --clobber
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual run: the release creates the tag on the commit that was built.
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" \
              --title "Yunori Mail Server ${TAG#v}" --generate-notes
          else
            gh release create "$TAG" dist/* --verify-tag \
              --title "Yunori Mail Server ${TAG#v}" --generate-notes
          fi
