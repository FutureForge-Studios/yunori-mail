[package]
name = "yunori-mail"
version = "0.2.2"
edition = "2024"
rust-version = "1.85"
description = "Yunori Mail Server: installer, control plane, HTTPS edge and console for a self-hosted Stalwart mail server"
license = "AGPL-3.0-only"
repository = "https://github.com/FutureForge-Studios/yunori-mail"
publish = false

[[bin]]
name = "yunori-mail"
path = "src/main.rs"

[dependencies]
socket2 = { version = "0.6", features = ["all"] }
# runtime & web
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
http = "1"
bytes = "1"
futures-util = "0.3"

# serde & cli
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }

# storage & crypto
rusqlite = { version = "0.32", features = ["bundled"] }
aes-gcm = "0.10"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
totp-rs = { version = "5", features = ["otpauth"] }
zeroize = "1"

# dns, tls, acme
hickory-resolver = "0.24"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
x509-parser = "0.16"
instant-acme = { version = "0.8", default-features = false, features = ["ring", "hyper-rustls"] }
rcgen = "0.13"
webpki-roots = "0.26"

# misc
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
url = "2"
regex-lite = "0.1"
rpassword = "7"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
